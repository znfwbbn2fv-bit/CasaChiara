name: Verifica CasaChiara
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo JavaScript e test finanziari
        run: |
          node --check core.js
          node --check reconciliation.js
          node --check reconciliation25.js
          node --check planning26.js
          node --check secure-backup.js
          node --check app.js
          node --check sw.js
          node --test tests/*.test.cjs
